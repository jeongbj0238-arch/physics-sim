<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>단진동 · 물리 시뮬레이터</title>
<meta name="description" content="용수철 진자와 원운동의 그림자가 그리는 사인 곡선, 그리고 가속도와 변위의 관계를 보는 시뮬레이션" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css" />
<link rel="stylesheet" href="simple-harmonic.css" />
</head>
<body data-page="simple-harmonic">

<div class="page">

  <header class="topbar">
    <div class="brand">
      <div>
        <span class="eyebrow"><a href="index.html">← 탄성파와 소리</a> · Simple Harmonic Motion</span>
        <h1>단진동</h1>
      </div>
    </div>

    <nav class="tabs" id="tabs" aria-label="활동 단계">
      <button class="tab is-active" data-tab="1" type="button"><b>1</b>용수철 진자</button>
      <button class="tab" data-tab="2" type="button"><b>2</b>원운동의 그림자</button>
      <button class="tab" data-tab="3" type="button"><b>3</b>가속도와 변위</button>
    </nav>

    <div class="topbar-actions">
      <div class="quick-actions">
        <button class="btn btn-ghost" id="pauseBtn" type="button">일시정지</button>
        <button class="btn btn-ghost" id="resetBtn" type="button">초기화</button>
      </div>
      <button class="btn btn-ghost" id="settingsToggle" type="button">⚙ 설정</button>
    </div>
  </header>

  <main class="layout">

    <section class="stage card" id="stage">
      <canvas id="simCanvas"></canvas>
      <div class="badge stage-tag" id="statusTag"></div>
      <div class="stage-toast hidden" id="toast"></div>
      <div class="stage-hint" id="stageHint"></div>
    </section>

    <div class="dock">

      <section class="obs-card card" data-card="0">
        <div class="obs-head">
          <span class="obs-name" data-role="name">–</span>
          <span class="obs-tag" data-role="tag"></span>
        </div>
        <div class="obs-main">
          <div class="obs-f" data-role="fbox"><i data-role="sym"></i><b data-role="val">–</b><span data-role="unit"></span></div>
          <div class="obs-sub">
            <div><span data-role="k1"></span><b data-role="v1">–</b></div>
            <div><span data-role="k2"></span><b data-role="v2">–</b></div>
          </div>
        </div>
        <canvas class="strip" data-role="strip"></canvas>
        <div class="strip-legend" data-role="legend"></div>
        <div class="obs-formula" data-role="f1"></div>
      </section>

      <section class="ctrl card">
        <div class="ctrl-pane" data-pane="1">
          <div class="ctrl-row">
            <button class="btn btn-primary release-btn" type="button">당겼다 놓기</button>
            <button class="btn btn-ghost is-on" id="bBtn" type="button" aria-pressed="true">진자 B</button>
          </div>
          <div class="ctrl-row">
            <div class="seg" id="editSeg" role="group" aria-label="조절할 진자">
              <button type="button" data-edit="a" class="is-active">진자 A 조절</button>
              <button type="button" data-edit="b">진자 B 조절</button>
            </div>
          </div>
          <div class="param-row">
            <label for="kNum1" title="용수철 상수">k</label>
            <input type="range" class="k-input" min="50" max="400" step="10" aria-label="용수철 상수" />
            <span class="num-wrap"><input type="number" class="num k-num" id="kNum1" min="50" max="400" step="10" /><i>N/m</i></span>
          </div>
          <div class="param-row">
            <label for="mNum1" title="추의 질량">m</label>
            <input type="range" class="m-input" min="0.5" max="2" step="0.1" aria-label="추의 질량" />
            <span class="num-wrap"><input type="number" class="num m-num" id="mNum1" min="0.5" max="2" step="0.1" /><i>kg</i></span>
          </div>
        </div>

        <div class="ctrl-pane hidden" data-pane="2">
          <div class="ctrl-row">
            <button class="btn btn-primary" id="restartBtn" type="button">처음 위치에서 다시</button>
          </div>
          <div class="param-row">
            <label for="r2Num" title="원운동의 반지름 = 단진동의 진폭">반지름</label>
            <input type="range" id="r2Input" min="0.05" max="0.15" step="0.01" aria-label="반지름" />
            <span class="num-wrap"><input type="number" class="num" id="r2Num" min="0.05" max="0.15" step="0.01" /><i>m</i></span>
          </div>
          <div class="param-row">
            <label for="w2Num" title="각속도">ω</label>
            <input type="range" id="w2Input" min="1" max="10" step="0.1" aria-label="각속도" />
            <span class="num-wrap"><input type="number" class="num" id="w2Num" min="1" max="10" step="0.1" /><i>rad/s</i></span>
          </div>
        </div>

        <div class="ctrl-pane hidden" data-pane="3">
          <div class="ctrl-row">
            <div class="seg" id="mode3Seg" role="group" aria-label="해석할 운동">
              <button type="button" data-mode="spring" class="is-active">용수철</button>
              <button type="button" data-mode="circle">원운동</button>
            </div>
            <button class="btn btn-primary release-btn spring-only" type="button">당겼다 놓기</button>
            <button class="btn btn-primary circle-only hidden" id="restart3Btn" type="button">처음부터</button>
            <button class="btn btn-ghost" id="tangentBtn" type="button" aria-pressed="false">기울기 보기</button>
          </div>
          <div class="param-row spring-only">
            <label for="kNum3" title="용수철 상수">k</label>
            <input type="range" class="k-input" min="50" max="400" step="10" aria-label="용수철 상수" />
            <span class="num-wrap"><input type="number" class="num k-num" id="kNum3" min="50" max="400" step="10" /><i>N/m</i></span>
          </div>
          <div class="param-row spring-only">
            <label for="mNum3" title="추의 질량">m</label>
            <input type="range" class="m-input" min="0.5" max="2" step="0.1" aria-label="추의 질량" />
            <span class="num-wrap"><input type="number" class="num m-num" id="mNum3" min="0.5" max="2" step="0.1" /><i>kg</i></span>
          </div>
          <div class="param-row circle-only hidden">
            <label for="r3Num" title="원운동의 반지름">반지름</label>
            <input type="range" id="r3Input" min="0.05" max="0.15" step="0.01" aria-label="반지름" />
            <span class="num-wrap"><input type="number" class="num" id="r3Num" min="0.05" max="0.15" step="0.01" /><i>m</i></span>
          </div>
          <div class="param-row circle-only hidden">
            <label for="w3Num" title="각속도">ω</label>
            <input type="range" id="w3Input" min="1" max="10" step="0.1" aria-label="각속도" />
            <span class="num-wrap"><input type="number" class="num" id="w3Num" min="1" max="10" step="0.1" /><i>rad/s</i></span>
          </div>
          <div class="param-row">
            <label for="dtNum" title="할선의 두 점 사이 시간. 0이면 접선">Δt</label>
            <input type="range" id="dtInput" min="0" max="0.3" step="0.02" aria-label="할선의 Δt" />
            <span class="num-wrap"><input type="number" class="num" id="dtNum" min="0" max="0.3" step="0.02" /><i>s</i></span>
          </div>
        </div>
      </section>

      <section class="obs-card card" data-card="1">
        <div class="obs-head">
          <span class="obs-name" data-role="name">–</span>
          <span class="obs-tag" data-role="tag"></span>
        </div>
        <div class="obs-main">
          <div class="obs-f" data-role="fbox"><i data-role="sym"></i><b data-role="val">–</b><span data-role="unit"></span></div>
          <div class="obs-sub">
            <div><span data-role="k1"></span><b data-role="v1">–</b></div>
            <div><span data-role="k2"></span><b data-role="v2">–</b></div>
          </div>
        </div>
        <canvas class="strip" data-role="strip"></canvas>
        <div class="strip-legend" data-role="legend"></div>
        <div class="obs-formula" data-role="f1"></div>
      </section>

    </div>
  </main>

  <div class="settings-overlay hidden" id="settingsOverlay">
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <aside class="card settings-panel">
      <div class="settings-panel-header">
        <h2>설정</h2>
        <button class="settings-close" id="settingsClose" type="button" aria-label="설정 닫기">✕</button>
      </div>

      <div class="control-group">
        <div class="control-row"><label for="speedSelect">화면 속도</label></div>
        <select id="speedSelect">
          <option value="1" selected>실제 빠르기</option>
          <option value="0.5">느리게 (1/2)</option>
          <option value="0.25">아주 느리게 (1/4)</option>
        </select>
      </div>

      <p class="control-hint">마찰과 공기 저항이 없는 용수철 진자와 등속 원운동이다. 변위는 평형 위치(원의 중심 높이)에서 위쪽을 +로 잰다.</p>
    </aside>
  </div>

</div>

<script src="../../shared/sim-utils.js"></script>
<script src="simple-harmonic.js"></script>
</body>
</html>
