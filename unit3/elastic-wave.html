<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>탄성파의 진행과 반사 · 물리 시뮬레이터</title>
<meta name="description" content="공과 용수철을 이은 사슬로 탄성파가 진행하고 반사·투과되는 모습을 눈으로 보는 시뮬레이션" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="elastic-wave.css" />
</head>
<body data-page="elastic-wave">

<div class="page">

  <header class="topbar">
    <div class="brand">
      <div>
        <span class="eyebrow"><a href="index.html">← 탄성파와 소리</a> · Elastic Waves</span>
        <h1>탄성파의 진행과 반사</h1>
      </div>
    </div>

    <nav class="tabs" id="tabs" aria-label="활동 단계">
      <button class="tab is-active" data-tab="1" type="button"><b>1</b>파동의 진행</button>
      <button class="tab" data-tab="2" type="button"><b>2</b>끝에서의 반사</button>
      <button class="tab" data-tab="3" type="button"><b>3</b>매질이 바뀔 때</button>
    </nav>

    <div class="topbar-actions">
      <div class="quick-actions">
        <button class="btn btn-ghost" id="pauseBtn" type="button">일시정지</button>
        <button class="btn btn-ghost" id="resetBtn" type="button">초기화</button>
      </div>
      <button class="btn btn-ghost" id="settingsToggle" type="button">⚙ 설정</button>
    </div>
  </header>

  <main class="layout">

    <section class="stage card" id="stage">
      <canvas id="simCanvas"></canvas>
      <div class="badge stage-tag" id="statusTag">횡파</div>
      <button class="stage-legend is-on hidden" id="partsBtn" type="button" aria-pressed="true" title="입사파·반사파 선 켜고 끄기">
        <span class="leg-check">✓</span><span class="leg leg-inc"></span>입사파<span class="leg leg-ref"></span>반사파
      </button>
      <div class="stage-toast hidden" id="toast"></div>
      <div class="stage-hint" id="stageHint"></div>
    </section>

    <div class="dock">

      <section class="obs-card card" data-card="0">
        <div class="obs-head">
          <span class="obs-name" data-role="name">–</span>
          <span class="obs-tag" data-role="tag"></span>
        </div>
        <div class="obs-main">
          <div class="obs-f" data-role="fbox"><i data-role="sym"></i><b data-role="val">–</b><span data-role="unit"></span></div>
          <div class="obs-sub">
            <div><span data-role="k1"></span><b data-role="v1">–</b></div>
            <div><span data-role="k2"></span><b data-role="v2">–</b></div>
          </div>
        </div>
        <canvas class="strip" data-role="strip"></canvas>
        <div class="obs-formula" data-role="f1"></div>
        <div class="obs-formula" data-role="f2"></div>
      </section>

      <section class="ctrl card">
        <div class="ctrl-pane" data-pane="1">
          <div class="ctrl-row">
            <div class="seg" id="modeSeg" role="group" aria-label="파동의 종류">
              <button type="button" data-mode="T" class="is-active">횡파</button>
              <button type="button" data-mode="L">종파</button>
            </div>
            <button class="btn btn-primary pulse-btn" type="button">펄스</button>
            <button class="btn btn-ghost cont-btn" type="button">연속파</button>
          </div>
          <div class="param-row">
            <label for="fNum1">진동수</label>
            <input type="range" class="f-input" min="0.5" max="3" step="0.1" aria-label="연속파 진동수" />
            <span class="num-wrap"><input type="number" class="num f-num" id="fNum1" min="0.5" max="3" step="0.1" /><i>Hz</i></span>
          </div>
        </div>

        <div class="ctrl-pane hidden" data-pane="2">
          <div class="ctrl-row">
            <div class="seg" id="endSeg" role="group" aria-label="오른쪽 끝">
              <button type="button" data-end="fixed" class="is-active">고정단</button>
              <button type="button" data-end="free">자유단</button>
            </div>
            <button class="btn btn-primary pulse-btn" type="button">펄스</button>
            <button class="btn btn-ghost cont-btn" type="button">연속파</button>
          </div>
          <div class="param-row">
            <label for="fNum2">진동수</label>
            <input type="range" class="f-input" min="0.5" max="3" step="0.1" aria-label="연속파 진동수" />
            <span class="num-wrap"><input type="number" class="num f-num" id="fNum2" min="0.5" max="3" step="0.1" /><i>Hz</i></span>
          </div>
        </div>

        <div class="ctrl-pane hidden" data-pane="3">
          <div class="ctrl-row">
            <div class="seg" id="orderSeg" role="group" aria-label="파동이 지나가는 순서">
              <button type="button" data-order="LH" class="is-active">얇은 → 두꺼운</button>
              <button type="button" data-order="HL">두꺼운 → 얇은</button>
            </div>
          </div>
          <div class="ctrl-row">
            <button class="btn btn-primary pulse-btn" type="button">펄스</button>
            <button class="btn btn-ghost cont-btn" type="button">연속파</button>
          </div>
          <div class="param-row">
            <label for="thickNum" title="두꺼운 줄의 두께 (얇은 줄의 몇 배)">두께</label>
            <input type="range" id="thickInput" min="1" max="3" step="0.5" aria-label="두꺼운 줄의 두께" />
            <span class="num-wrap"><input type="number" class="num" id="thickNum" min="1" max="3" step="0.5" /><i>배</i></span>
          </div>
          <div class="param-row">
            <label for="fNum3">진동수</label>
            <input type="range" class="f-input" min="0.5" max="3" step="0.1" aria-label="연속파 진동수" />
            <span class="num-wrap"><input type="number" class="num f-num" id="fNum3" min="0.5" max="3" step="0.1" /><i>Hz</i></span>
          </div>
        </div>
      </section>

      <section class="obs-card card" data-card="1">
        <div class="obs-head">
          <span class="obs-name" data-role="name">–</span>
          <span class="obs-tag" data-role="tag"></span>
        </div>
        <div class="obs-main">
          <div class="obs-f" data-role="fbox"><i data-role="sym"></i><b data-role="val">–</b><span data-role="unit"></span></div>
          <div class="obs-sub">
            <div><span data-role="k1"></span><b data-role="v1">–</b></div>
            <div><span data-role="k2"></span><b data-role="v2">–</b></div>
          </div>
        </div>
        <canvas class="strip" data-role="strip"></canvas>
        <div class="obs-formula" data-role="f1"></div>
        <div class="obs-formula" data-role="f2"></div>
      </section>

    </div>
  </main>

  <div class="settings-overlay hidden" id="settingsOverlay">
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <aside class="card settings-panel">
      <div class="settings-panel-header">
        <h2>설정</h2>
        <button class="settings-close" id="settingsClose" type="button" aria-label="설정 닫기">✕</button>
      </div>

      <div class="control-group">
        <div class="control-row"><label for="slowSelect">화면 속도</label></div>
        <select id="slowSelect">
          <option value="1" selected>보통 (실제 빠르기)</option>
          <option value="0.5">느리게 (1/2)</option>
          <option value="0.25">아주 느리게 (1/4)</option>
        </select>
      </div>

      <p class="control-hint">횡파 2.0 m/s, 종파 3.5 m/s인 용수철이다. 지진파처럼 종파가 더 빠르다.</p>
    </aside>
  </div>

</div>

<script src="../shared/sim-utils.js"></script>
<script src="elastic-wave.js"></script>
</body>
</html>
